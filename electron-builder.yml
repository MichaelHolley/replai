appId: com.fipsi.app
productName: Fipsi
copyright: Copyright © 2026 Michael Holley

directories:
  buildResources: build
  output: dist

# Ad-hoc sign the finished bundle (see build/after-pack.cjs for why).
afterPack: build/after-pack.cjs

files:
  - out/**/*
  - package.json

# Ship the tray icons alongside the app; resolved at process.resourcesPath/resources.
extraResources:
  - from: resources
    to: resources
    filter:
      - "**/*"

asar: true

mac:
  category: public.app-category.productivity
  target:
    - dir
  icon: build/icon.png
  # Menu-bar utility: hide from Dock + app switcher.
  extendInfo:
    LSUIElement: 1
    NSScreenCaptureUsageDescription: >-
      Fipsi captures a screenshot of the on-screen conversation you select so the
      AI can suggest a reply. The screenshot is sent only to the AI provider you
      configure and the temporary file is deleted immediately after encoding.
  # v1 ships unsigned (developer audience, build-from-source). Signing +
  # notarization are a hard blocker before any non-developer distribution.
  identity: null
